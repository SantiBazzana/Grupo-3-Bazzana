<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Acceso denegado', ~{::main})}">
<body>
<main class="contenedor">
    <th:block th:replace="~{turnos/fragments/estilos :: estilos}"></th:block>

    <div class="tarjeta" style="max-width: 640px;">
        <div class="tarjeta__cabecera">
            <h1>Acceso denegado</h1>
            <span class="chip chip--inactivo">403 Forbidden</span>
        </div>
        <p class="sub">No podés realizar esta operación con el rol de tu usuario.</p>

        <div class="alerta" role="alert">
            <strong th:text="${errorCodigo}">ACCESO_DENEGADO</strong> ·
            <span th:text="${errorMensaje}">No tiene permiso para esta operación.</span>
        </div>

        <div class="acciones">
            <a class="boton" th:href="@{/agenda}">Volver a la agenda</a>
            <a class="boton boton--sec" th:href="@{/panel}">Volver al panel</a>
        </div>
    </div>
</main>
</body>
</html>
