<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Composición de las vistas de turnos</title>
</head>
<body>
<th:block th:fragment="estilos">
    <!--
      Composición específica de C-10. No copia valores de tokens: usa las variables ya definidas en
      static/css/estilos.css (C-09, revisión 1 aprobada). Se incluye dentro de <main> porque el layout
      reemplaza el <head> de la plantilla que lo invoca.
    -->
    <style>
        .layout-dos-columnas {
            display: grid;
            gap: 20px;
            grid-template-columns: minmax(0, 1fr) 320px;
            align-items: start;
        }

        .form-grid {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .form-grid .campo { margin-bottom: 0; }
        .form-grid .campo--completo { grid-column: 1 / -1; }

        .campo--check {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .campo--check input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin: 0;
        }

        .campo--check label { font-weight: 400; }

        .boton[disabled] { opacity: .5; cursor: not-allowed; }

        .detalle-lista {
            display: grid;
            gap: 8px;
            margin: 0 0 18px;
        }

        .detalle-lista div {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px dashed var(--borde);
            padding-bottom: 8px;
        }

        .detalle-lista dt { color: var(--tinta-suave); font-size: 13px; margin: 0; }
        .detalle-lista dd { margin: 0; font-weight: 600; text-align: right; }

        .acciones {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip--sobreturno { background: #fdf6e9; color: #70420a; }

        .enlace-detalle {
            display: block;
            margin-top: 4px;
            font-size: 13px;
        }

        .vacio--compacto {
            padding: 12px;
            margin: 10px 0 0;
            text-align: left;
        }

        @media (max-width: 820px) {
            .layout-dos-columnas { grid-template-columns: 1fr; }
        }

        @media (max-width: 700px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-grid .campo--completo { grid-column: auto; }
            .detalle-lista div { flex-direction: column; gap: 0; }
            .detalle-lista dd { text-align: left; }
        }
    </style>
</th:block>
</body>
</html>
