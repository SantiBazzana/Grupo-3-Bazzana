<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Composición de las vistas de turnos</title>
</head>
<body>
<th:block th:fragment="estilos">
    <!--
      Composición específica de C-10 (Revisión 2). Usa las variables definidas en
      static/css/estilos.css e incorpora la grilla interactiva de botones de horarios.
    -->
    <style>
        .layout-dos-columnas {
            display: grid;
            gap: 22px;
            grid-template-columns: minmax(0, 1fr) 340px;
            align-items: start;
        }

        .form-grid {
            display: grid;
            gap: 14px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .form-grid--agenda {
            grid-template-columns: minmax(180px, 220px) minmax(220px, 1fr) auto;
            align-items: end;
        }

        .form-grid .campo { margin-bottom: 0; }
        .form-grid .campo--completo { grid-column: 1 / -1; }

        .campo--check {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border-radius: var(--radio-sm);
            background: var(--superficie-alt);
            border: 1px solid var(--borde);
        }

        .campo--check input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin: 0;
            accent-color: var(--primario);
            cursor: pointer;
        }

        .campo--check label {
            font-weight: 500;
            cursor: pointer;
            margin: 0;
        }

        .boton[disabled] {
            opacity: .55;
            cursor: not-allowed;
        }

        /* ==========================================================================
           Grilla Interactiva de Botones de Horarios (Nuevo Turno)
           ========================================================================== */

        .selector-horario {
            grid-column: 1 / -1;
            border: 1px solid var(--borde);
            border-radius: var(--radio);
            background: var(--superficie-alt);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .selector-horario__cabecera {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--borde);
        }

        .selector-horario__fecha-grupo {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        .selector-horario__fecha-grupo label {
            font-size: 13px;
            font-weight: 700;
            color: var(--tinta);
        }

        .selector-horario__fecha-input {
            height: 38px !important;
            width: auto !important;
            min-width: 165px;
            padding: 0 10px !important;
            font-weight: 600;
        }

        .atajos-fecha {
            display: inline-flex;
            gap: 6px;
        }

        .atajo-btn {
            height: 32px;
            padding: 0 10px;
            border-radius: 6px;
            border: 1px solid var(--borde-fuerte);
            background: var(--superficie);
            color: var(--tinta-suave);
            font: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all .12s ease;
        }

        .atajo-btn:hover {
            border-color: var(--primario);
            color: var(--primario-oscuro);
            background: var(--primario-suave);
        }

        .leyenda-slots {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            color: var(--tinta-suave);
        }

        .leyenda-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .leyenda-dot {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            display: inline-block;
        }

        .leyenda-dot--libre {
            background: var(--superficie);
            border: 1.5px solid var(--primario);
        }

        .leyenda-dot--activo {
            background: var(--primario);
        }

        .leyenda-dot--ocupado {
            background: var(--peligro-suave);
            border: 1.5px solid var(--peligro);
        }

        .leyenda-dot--sobreturno {
            background: var(--acento-suave);
            border: 1.5px solid var(--acento);
        }

        .estado-disponibilidad {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 12px;
            color: var(--tinta-suave);
            background: var(--superficie);
            border: 1px solid var(--borde);
            padding: 8px 12px;
            border-radius: var(--radio-sm);
        }

        .franja-bloque {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .franja-titulo {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--tinta-tenue);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .slots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(102px, 1fr));
            gap: 8px;
        }

        .slot-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 9px 8px;
            border-radius: var(--radio-sm);
            border: 1px solid var(--borde-fuerte);
            background: var(--superficie);
            color: var(--tinta);
            font: inherit;
            cursor: pointer;
            transition: all .14s ease;
            position: relative;
        }

        .slot-btn__hora {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .slot-btn__estado {
            font-size: 11px;
            font-weight: 500;
            color: var(--exito);
        }

        .slot-btn:hover:not(:disabled) {
            border-color: var(--primario);
            background: var(--primario-suave);
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(15, 118, 110, .12);
        }

        .slot-btn:focus-visible {
            outline: none;
            box-shadow: var(--foco);
        }

        .slot-btn--activo,
        .slot-btn--activo:hover:not(:disabled) {
            background: var(--primario);
            border-color: var(--primario-oscuro);
            color: #fff;
            box-shadow: 0 4px 12px rgba(15, 118, 110, .28);
        }

        .slot-btn--activo .slot-btn__estado {
            color: #ccfbf1;
            font-weight: 600;
        }

        .slot-btn--ocupado,
        .slot-btn--ocupado:disabled {
            background: #fff1f2;
            border-color: #fecdd3;
            color: #9f1239;
            cursor: not-allowed;
            opacity: 0.78;
        }

        .slot-btn--ocupado .slot-btn__hora {
            text-decoration: line-through;
        }

        .slot-btn--ocupado .slot-btn__estado {
            color: var(--peligro);
            font-weight: 600;
        }

        .slot-btn--sobreturno {
            background: var(--acento-suave);
            border-color: var(--acento-borde);
            color: #92400e;
        }

        .slot-btn--sobreturno .slot-btn__estado {
            color: var(--acento);
            font-weight: 600;
        }

        .slot-btn--sobreturno.slot-btn--activo {
            background: var(--acento);
            border-color: #92400e;
            color: #fff;
        }

        .slot-btn--sobreturno.slot-btn--activo .slot-btn__estado {
            color: #fef3c7;
        }

        .resumen-horario {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            border-radius: var(--radio-sm);
            background: var(--primario-suave);
            border: 1px solid var(--primario-borde);
            color: var(--primario-oscuro);
            font-size: 13px;
        }

        .resumen-horario__texto strong {
            font-weight: 700;
        }

        .inicio-manual {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .inicio-manual label {
            font-size: 12px;
            font-weight: 600;
            color: var(--primario-oscuro);
            white-space: nowrap;
        }

        .inicio-manual input[type="datetime-local"] {
            height: 36px;
            width: auto;
            font-size: 13px;
            font-weight: 600;
            padding: 0 10px;
            border-color: var(--primario-borde);
            background: var(--superficie);
        }

        /* ==========================================================================
           Agenda y Detalle de Turno
           ========================================================================== */

        .detalle-lista {
            display: grid;
            gap: 10px;
            margin: 0 0 20px;
        }

        .detalle-lista div {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border-bottom: 1px dashed var(--borde);
            padding-bottom: 10px;
        }

        .detalle-lista dt {
            color: var(--tinta-suave);
            font-size: 13px;
            font-weight: 500;
            margin: 0;
        }

        .detalle-lista dd {
            margin: 0;
            font-weight: 600;
            text-align: right;
            color: var(--tinta);
        }

        .acciones {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .chip--sobreturno {
            background: var(--acento-suave);
            border-color: var(--acento-borde);
            color: #92400e;
        }

        .hora-bloque {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .hora-badge {
            font-weight: 700;
            color: var(--primario-oscuro);
            background: var(--primario-suave);
            border: 1px solid var(--primario-borde);
            padding: 3px 9px;
            border-radius: 6px;
            font-size: 13px;
        }

        .enlace-detalle {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
            font-size: 12px;
            font-weight: 600;
            color: var(--primario);
            text-decoration: none;
        }

        .enlace-detalle:hover {
            text-decoration: underline;
        }

        .vacio--compacto {
            padding: 12px 14px;
            margin: 10px 0 0;
            text-align: left;
            border-style: solid;
        }

        .mini-agenda-lista {
            list-style: none;
            padding: 0;
            margin: 10px 0 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .mini-agenda-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 10px;
            border-radius: var(--radio-sm);
            background: var(--superficie-alt);
            border: 1px solid var(--borde);
            font-size: 12px;
        }

        @media (max-width: 960px) {
            .layout-dos-columnas { grid-template-columns: 1fr; }
            .form-grid--agenda { grid-template-columns: 1fr; }
        }

        @media (max-width: 700px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-grid .campo--completo { grid-column: auto; }
            .detalle-lista div { flex-direction: column; align-items: flex-start; gap: 2px; }
            .detalle-lista dd { text-align: left; }
            .resumen-horario { flex-direction: column; align-items: stretch; }
        }
    </style>
</th:block>
</body>
</html>
