<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout('Sillones', ~{::main})}">
<body>
<main class="contenedor">
    <h1>Sillones</h1>
    <p class="sub">Boxes del consultorio. Un turno siempre ocupa un sillón.</p>

    <div class="alerta" role="alert" th:if="${errorCodigo}">
        <strong th:text="${errorCodigo}">CODIGO</strong> · <span th:text="${errorMensaje}">mensaje</span>
    </div>

    <div class="layout-gestion">
        <section class="tarjeta" aria-labelledby="lista-sillones">
            <h2 id="lista-sillones">Listado</h2>
            <div class="tabla-scroll">
                <table>
                    <caption>Sillones cargados</caption>
                    <thead>
                    <tr>
                        <th scope="col">Nombre</th>
                        <th scope="col">Estado</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="sillon : ${sillones}">
                        <td th:text="${sillon.nombre}">Sillón 1</td>
                        <td>
                            <span class="chip" th:classappend="${sillon.activo} ? 'chip--activo' : 'chip--inactivo'"
                                  th:text="${sillon.activo} ? 'Activo' : 'Inactivo'">Activo</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <p class="vacio" th:if="${#lists.isEmpty(sillones)}">Todavía no hay sillones cargados.</p>
        </section>

        <aside class="tarjeta" id="form-alta-sillon" sec:authorize="hasRole('ADMIN')"
               aria-labelledby="alta-sillon">
            <h2 id="alta-sillon">Nuevo sillón</h2>
            <form th:action="@{/gestion/sillones}" method="post">
                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input id="nombre" name="nombre" required>
                </div>
                <button class="boton boton--bloque" type="submit">Dar de alta</button>
            </form>
        </aside>
    </div>
</main>
</body>
</html>
