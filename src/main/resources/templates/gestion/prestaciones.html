<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout('Prestaciones', ~{::main})}">
<body>
<main class="contenedor">
    <h1>Prestaciones</h1>
    <p class="sub">La duración define el fin del turno y debe ser múltiplo de 5 minutos.</p>

    <div class="alerta" role="alert" th:if="${errorCodigo}">
        <strong th:text="${errorCodigo}">CODIGO</strong> · <span th:text="${errorMensaje}">mensaje</span>
    </div>

    <div class="layout-gestion">
        <section class="tarjeta" aria-labelledby="lista-prestaciones">
            <h2 id="lista-prestaciones">Listado</h2>
            <div class="tabla-scroll">
                <table>
                    <caption>Prestaciones cargadas</caption>
                    <thead>
                    <tr>
                        <th scope="col">Nombre</th>
                        <th scope="col">Duración</th>
                        <th scope="col">Estado</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="prestacion : ${prestaciones}">
                        <td th:text="${prestacion.nombre}">Control</td>
                        <td th:text="${prestacion.duracionMinutos} + ' min'">30 min</td>
                        <td>
                            <span class="chip" th:classappend="${prestacion.activa} ? 'chip--activo' : 'chip--inactivo'"
                                  th:text="${prestacion.activa} ? 'Activa' : 'Inactiva'">Activa</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <p class="vacio" th:if="${#lists.isEmpty(prestaciones)}">Todavía no hay prestaciones cargadas.</p>
        </section>

        <aside class="tarjeta" id="form-alta-prestacion" sec:authorize="hasRole('ADMIN')"
               aria-labelledby="alta-prestacion">
            <h2 id="alta-prestacion">Nueva prestación</h2>
            <form th:action="@{/gestion/prestaciones}" method="post">
                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input id="nombre" name="nombre" required>
                </div>
                <div class="campo">
                    <label for="duracion">Duración (minutos)</label>
                    <input id="duracion" name="duracionMinutos" type="number" min="5" step="5" required>
                </div>
                <button class="boton boton--bloque" type="submit">Dar de alta</button>
            </form>
        </aside>
    </div>
</main>
</body>
</html>
