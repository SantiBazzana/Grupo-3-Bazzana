<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Turnos Odontología</title>
  <link rel="stylesheet" href="mockups.css">
</head>
<body>
<div class="login-pantalla">
  <main class="login-caja">
    <a class="marca" href="panel.html"><span class="icono">+</span> Turnos Odontología</a>
    <h1>Ingresar al consultorio</h1>
    <p class="sub">Usá tu usuario y contraseña de gestión.</p>

    <!-- Estado de error del form login de Spring Security (/login?error) -->
    <div class="alerta" role="alert">Usuario o contraseña incorrectos.</div>

    <form action="/login" method="post">
      <div class="campo">
        <label for="username">Usuario</label>
        <input id="username" name="username" autocomplete="username" value="secretaria">
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" value="••••••••">
      </div>
      <input type="hidden" name="_csrf" value="token-csrf-de-la-vista">
      <button class="boton boton--bloque" type="submit">Ingresar</button>
    </form>
    <p class="leyenda">Los usuarios de ejemplo se habilitan con variables de entorno. Sin datos reales de pacientes.</p>
  </main>
</div>
</body>
</html>
